[project]
name = "gridmind-api"
version = "0.1.0"
description = "GridMind backend: FastAPI + LangGraph research agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic-settings>=2.4",
  "supabase>=2.8",
  "langgraph>=0.2",
  "langchain-groq>=0.2",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "redis>=5.0",
  "trafilatura>=1.12",
  "ddgs>=9.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
